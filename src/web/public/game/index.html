<head>

  <meta name="theme-color" content="#f5f5f5">
  <title>Shashka</title>
  <script>
    (function () {
      var t = localStorage.getItem("checkers-theme");
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
